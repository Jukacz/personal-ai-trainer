[pytest]
# Pytest configuration for the project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    views: HTTP endpoint tests
    controllers: Business logic tests
    repositories: Data access layer tests
    services: Service/agent orchestration tests
    agents: LangChain agent tests
    integration: Integration tests
    unit: Unit tests
    asyncio: Asynchronous tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = api,agents,database,schemas
omit =
    */tests/*
    */test_*.py
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
